name: Credential health

# Daily watch on the API keys of every production app. Each app runs its own
# key probes in production and answers verdicts only, never values. This job
# asks each one with HEALTH_PROBE_SECRET and goes red on a dead key or a
# refused secret. A weekly health check reads this workflow's last seven runs.
#
# Two-sided proof: run it by hand with force_fail=true. It sends a deliberately
# wrong secret and must go red.

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Send a deliberately wrong secret (proves the red path)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: credential-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe app credential endpoints
        env:
          HEALTH_PROBE_SECRET: ${{ secrets.HEALTH_PROBE_SECRET }}
          HEALTH_TARGETS: ${{ vars.HEALTH_TARGETS }}
          FORCE_FAIL: ${{ inputs.force_fail == true && 'true' || '' }}
        run: |
          set +e
          node credential-health/credential-health-probe.mjs
          code=$?
          set -e
          case "$code" in
            0) echo "::notice::green" ;;
            1) echo "::error::RED, a key is dead or an endpoint refused the secret" ;;
            2) echo "::error::INCONCLUSIVE, no observation. The monitor is down, not a detected key failure" ;;
            *) echo "::error::crashed, exit ${code}" ;;
          esac
          exit $code
